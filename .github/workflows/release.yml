name: Build RIFT

on:
  push:
    branches: [ main, 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Vet & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows and macOS are the shipped hosts (macOS is the only place
        # the cgo/Objective-C code compiles); Linux keeps the core portable.
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  build:
    name: Build Windows binary
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Embed manifest & icon
        shell: bash
        run: |
          go install github.com/akavel/rsrc@latest
          cd cmd/rift && rsrc -manifest ../../rift.manifest -ico rift.ico -o rsrc.syso
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o rift.exe ./cmd/rift
      - name: Build installer
        shell: bash
        run: |
          choco install nsis -y --no-progress
          "/c/Program Files (x86)/NSIS/makensis.exe" installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: rift-windows
          path: |
            rift.exe
            RIFT_Setup.exe

  build-macos:
    name: Build macOS app
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build RIFT.app and RIFT.dmg
        run: bash scripts/macos/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rift-macos
          path: build/macos/RIFT.dmg
